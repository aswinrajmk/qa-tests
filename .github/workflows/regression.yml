name: Regression suite

# Everything tagged @smoke or @regression, nightly and on demand. Smoke is a subset of regression.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    # qa.yml pushes the HTML report to gh-pages; a called workflow cannot get more access than its caller grants.
    permissions:
      contents: write
    uses: ./.github/workflows/qa.yml
    secrets: inherit
    with:
      suite: regression
      grep: "@smoke|@regression"
